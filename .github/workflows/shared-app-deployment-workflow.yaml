name: Shared Application Deployment Workflow

permissions:
  id-token: write
  contents: read
  pull-requests: read
on:
  workflow_call:
    secrets:
      AZURE_TENANT_ID:
        required: true
        description: "Azure Tenant ID"
      AZURE_CLIENT_ID:
        required: true
        description: "Azure Client ID"
      AZURE_SUBSCRIPTION_ID:
        required: true
        description: "Azure Subscription ID"
      ACTIONS_AUTH_APP_ID:
        required: true
        description: "GitHub App ID"
      ACTIONS_AUTH_APP_PRIVATE_KEY:
        required: true
        description: "GitHub App Private Key"
    inputs:
      environment:
        type: string
        required: true
        description: "Environment"
      applicationFolder:
        type: string
        required: true
        description: "Application Folder"
      applicationName:
        type: string
        required: true
        description: "Application Name"
      applicationVersion:
        type: string
        required: true
        description: "Application Version"
      mockCostAndLogQueryApis:
        type: boolean
        default: false
        description: "Mock Log Query Client API calls"
      regionCode:
        type: string
        required: false
        description: "Region Code"
        default: "ne"
jobs:
  deploy_app:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v1

      - name: gh-app-install token
        id: gh-app
        uses: getsentry/action-github-app-token@v2
        with:
          app_id: ${{ secrets.ACTIONS_AUTH_APP_ID }}
          private_key: ${{ secrets.ACTIONS_AUTH_APP_PRIVATE_KEY }}

      - name: checkout devops-azure repo
        uses: actions/checkout@v3
        with:
          path: devops-azure
          repository: Uniphar/devops-azure
          token: ${{ steps.gh-app.outputs.token }}

      - name: checkout cost centre definition repo
        uses: actions/checkout@v3
        with:
          path: costcentre-definitions
          repository: Uniphar/costcentre-definitions
          ref: main
          token: ${{ steps.gh-app.outputs.token }}

      - name: azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: compute environment variables
        uses: azure/powershell@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} #required for gh cli to determine "current PR"
          AKS_CLUSTER_NAME: ${{ vars[format('AKS_{0}_{1}_CLUSTER', inputs.regionCode, inputs.environment)] }}
        with:
          inlineScript: |
            Import-Module .\devops-azure\src\Uniphar.DevOps.psd1 -ErrorAction Stop -Force

            $Environment = '${{ inputs.environment }}'
            $ACRName = Resolve-UniResourceName 'acr' $p_computeProject -Context $app_AKS
            $AKSClusterSAName =  Resolve-UniKubeWorkloadSAName  '${{ inputs.environment }}' 'platform-mammon'
            $AKSClusterSAID = Get-AzADServicePrincipal -DisplayName $AKSClusterSAName | Select-Object -ExpandProperty Id
            $AKSClusterServiceAccountClientId = (Get-UniDomainServicePrincipalDetail 'platform-mammon' '${{ inputs.environment }}').AppId
            $AzureKeyVaultName = Resolve-UniResourceName 'keyvault' "$p_devopsDomain-app" -Environment '${{ inputs.environment }}'
            $SBNamespace = Resolve-UniResourceName 'service-bus' $p_devopsDomain -Environment '${{ inputs.environment }}'
            $cronDayOfMonthSecret = Get-AzKeyVaultSecret -VaultName $AzureKeyVaultName -Name 'Mammon--ReportSettings--BillingPeriodStartDayInMonth'
            $cronDayOfMonth = (ConvertFrom-SecureString $cronDayOfMonthSecret.SecretValue -AsPlainText)
            $azureTenantId = (Get-AzContext).Tenant.Id

            echo "ENVIRONMENT=$Environment" >> $env:GITHUB_ENV
            echo "ACR_NAME=$ACRName" >> $env:GITHUB_ENV
            echo "AKS_CLUSTER_NAME=$env:AKS_CLUSTER_NAME" >> $env:GITHUB_ENV
            echo "AKS_CLUSTER_SERVICE_ACCOUNT_NAME=$AKSClusterSAName" >> $env:GITHUB_ENV
            echo "AKS_CLUSTER_SERVICE_ACCOUNT_ID=$AKSClusterSAID" >> $env:GITHUB_ENV
            echo "AKS_CLUSTER_SERVICE_ACCOUNT_CLIENT_ID=$AKSClusterServiceAccountClientId" >> $env:GITHUB_ENV
            echo "AZURE_KEY_VAULT_NAME=$AzureKeyVaultName" >> $env:GITHUB_ENV
            echo "AZURE_TENANT_ID=$azureTenantId" >> $env:GITHUB_ENV
            echo "SB_NAMESPACE=$SBNamespace" >> $env:GITHUB_ENV
            echo "APPLICATION_FOLDER=${{ inputs.applicationFolder }}" >> $env:GITHUB_ENV
            echo "APPLICATION_NAME=${{ inputs.applicationName }}" >> $env:GITHUB_ENV
            echo "APPLICATION_VERSION=${{ inputs.applicationVersion }}" >> $env:GITHUB_ENV
            echo "CRON_DAY_OF_MONTH=$cronDayOfMonth" >> $env:GITHUB_ENV
          azPSVersion: "latest"
          errorActionPreference: "stop"
          failOnStandardError: true
      - id: setup-diagrid-cli
        name: Setup Diagrid CLI
        shell: bash
        run: |
          curl -o- https://downloads.diagrid.io/cli/install.sh | bash
          sudo mv ./diagrid /usr/local/bin

          diagrid version
      - name: Powershell
        uses: azure/powershell@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} #required for gh cli to determine "current PR"
        with:
          inlineScript: |
            Import-Module .\devops-azure\src\Uniphar.DevOps.psd1 -ErrorAction Stop -Force
            . ./devops/Initialize-SubscriptionsRBAC.ps1
            . ./devops/Initialize-MammonWorkload.ps1
            Initialize-MammonWorkload '${{ inputs.environment }}'
            Initialize-SubscriptionsRBAC ./costcentre-definitions/costCentreRules.json ${{ env.AKS_CLUSTER_SERVICE_ACCOUNT_ID }}
          azPSVersion: "latest"
          errorActionPreference: "stop"
          failOnStandardError: true

      - name: setup kubectl
        uses: azure/use-kubelogin@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          kubelogin-version: "latest"

      - name: Gets K8s context
        uses: azure/aks-set-context@v3
        with:
          resource-group: compute-${{ inputs.regionCode }}-${{ inputs.environment }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          use-kubelogin: "true"
        id: k8context

      - name: Prepare Dapr catalyst components
        working-directory: ./devops/catalyst
        shell: pwsh
        run: |
          try {
            $replacements = [ordered]@{
              '${ENV}' = '${{ inputs.environment }}'
              '${CLIENT_ID}' = $env:AKS_CLUSTER_SERVICE_ACCOUNT_CLIENT_ID
              '${TENANT_ID}' = $env:AZURE_TENANT_ID
              '${SB_NAMESPACE}' = $env:SB_NAMESPACE
              '${CRON_DAY_OF_MONTH}' = $env:CRON_DAY_OF_MONTH
            }

            foreach ($placeholder in $replacements.Keys) {
              if ([string]::IsNullOrWhiteSpace($replacements[$placeholder])) {
                throw "No replacement value resolved for placeholder '$placeholder'."
              }
            }

            $files = @('mammon-azure-keyvault.yaml', 'mammon-kv-store.yaml', 'mammon-resilience.yaml', 'mammon-featureconfig.yaml', 'mammon-cron.yaml', 'mammon-pubsub.yaml')
            foreach ($file in $files) {
              $content = Get-Content -Path $file -Raw
              foreach ($placeholder in $replacements.Keys) {
                $content = $content.Replace($placeholder, $replacements[$placeholder])
              }

              if ($content.Contains('{') -or $content.Contains('}')) {
                throw "Unresolved placeholder remains in '$file' after substitution."
              }

              Set-Content -Path $file -Value $content -NoNewline
            }
          }
          catch {
            Write-Error $_
            exit 1
          }

      - name: Apply Dapr catalyst components
        working-directory: ./devops/catalyst
        shell: pwsh
        run: |
          diagrid apply -f ./mammon-azure-keyvault.yaml --project mammon
          diagrid apply -f ./mammon-kv-store.yaml --project mammon
          diagrid apply -f ./mammon-resilience.yaml --project mammon
          diagrid apply -f ./mammon-featureconfig.yaml --project mammon
          diagrid apply -f ./mammon-cron.yaml --project mammon
          diagrid apply -f ./mammon-pubsub.yaml --project mammon

      - name: setup helm
        uses: azure/setup-helm@v3

      - name: ACR login
        id: acrLogin
        run: |
          ACR_TOKEN=$(az acr login --name $ACR_NAME --expose-token --output tsv --query accessToken)
          echo "ACR_TOKEN=$ACR_TOKEN" >> $GITHUB_OUTPUT
          az acr login --name $ACR_NAME

      - name: get helm chart
        working-directory: ./charts/${{ env.APPLICATION_FOLDER }}
        run: helm pull oci://$ACR_NAME.azurecr.io/helm/${{ env.APPLICATION_NAME }} --version $APPLICATION_VERSION

      - name: deploy app
        working-directory: ./charts/${{ env.APPLICATION_FOLDER }}
        run: >
          helm upgrade
          ${{ env.APPLICATION_NAME }}
          ${{ env.APPLICATION_NAME }}-$APPLICATION_VERSION.tgz
          -i
          --set reason="Upgrade to $APPLICATION_VERSION"
          --set environment="$ENVIRONMENT"
          --set-string ACRName="$ACR_NAME"
          --set mockCostAndLogQueryApis=${{ inputs.mockCostAndLogQueryApis }}
          -n platform-mammon
          --atomic

  notify:
    needs: deploy_app
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') }}
    steps:
      - name: gh-app-install token
        id: gh-app
        uses: getsentry/action-github-app-token@v2
        with:
          app_id: ${{ secrets.ACTIONS_AUTH_APP_ID }}
          private_key: ${{ secrets.ACTIONS_AUTH_APP_PRIVATE_KEY }}

      - uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: "shared-failed-build-notification-workflow.yaml"
          inputs: '{
            "workflowId":"${{ github.run_id }}",
            "repository":"${{ github.repository }}"
            }'
          token: ${{ steps.gh-app.outputs.token }}
