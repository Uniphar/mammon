kind: Deployment
apiVersion: apps/v1
metadata:
  name: mammon
  labels:
    app: mammon-app
    service: mammon-srv
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      service: mammon-srv
  template:
    metadata:
      labels:
        app: mammon-app
        service: mammon-srv
        azure.workload.identity/use: "true"
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: platform-{{ .Chart.Name }}
        dapr.io/app-port: "{{ .Values.port }}"
        dapr.io/enable-api-logging: "true"
        dapr.io/config: platform-{{ .Chart.Name }}-featureconfig
    spec:
      serviceAccountName: {{ .Values.AKSClusterSAName }}
      containers:
        - name: mammon
        
{{- if .Values.mockCostAndLogQueryApis }}
          image: {{ .Values.ACRName }}.azurecr.io/{{ .Chart.Name }}-inttest:{{ .Chart.AppVersion }}
{{- else }}   
          image: {{ .Values.ACRName }}.azurecr.io/{{ .Chart.Name }}:{{ .Chart.AppVersion }}
{{- end }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: mammon-port
              containerPort: {{ .Values.port }}
              protocol: TCP
          env:
          - name: "ASPNETCORE_ENVIRONMENT"
            value: {{ .Values.environment | quote }}
          - name: "Mammon__CostCentreRuleEngineFilePath"
            value: /app/costCentreRules.json
          - name: "Mammon__CostCentreRuleEngineDevOpsConfigFilePath"
            value: /app/costCentreDevOpsRules.json
{{- if .Values.mockCostAndLogQueryApis }}
          - name: "Mammon__MockCostAPIResponseFilePath"
            value: ./Services/dummyCostAPIResponse.json
          - name: "Mammon__MockDevopsCostAPIResponseFilePath"
            value: ./Services/dummyDevOpsCostApiResponse.json
          - name: "Mammon__MockVisualStudioSubscriptionsCostsApiResponseFilePath"
            value: ./Services/dummyVisualStudioSubscriptionCostApiResponse.json
{{- end }}
          - name: "Mammon__StateStoreName"
            value: platform-mammon-kv-store
      nodeSelector:
        agentpool: platform