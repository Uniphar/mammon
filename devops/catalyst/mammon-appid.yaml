apiVersion: cra.diagrid.io/v1beta1
kind: AppIdentity
metadata:
  name: platform-mammon
spec:
  appEndpoint:
    url: http://mammon-srv.platform-mammon.svc.cluster.local:80
  protocol: http
  maxBodySize: 16Mi
  healthCheck:
    path: /mammon/health
    probe:
      enabled: true
      failureThreshold: 3
      intervalInSec: 5
      timeoutInMs: 500
